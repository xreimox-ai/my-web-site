<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة التوثيق العامة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { color: #38bdf8; margin-bottom: 15px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            text-align: center;
            font-size: 14px;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #0369a1; }
        #status { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>استمارة التوثيق 🚀</h2>
        <p>اكتب البيانات واضغط إرسال للتأكيد:</p>
        
        <input type="text" id="username" placeholder="اكتب اسمك هنا...">
        <button class="btn" onclick="sendData()">تأكيد وإرسال البيانات</button>
        
        <div id="status"></div>
    </div>

    <script>
        // ضع التوكن والـ ID الخاصين بك
        const BOT_TOKEN = "ضع_التوكن_هنا";
        const MY_CHAT_ID = "ضع_الـID_بتاعك_هنا";

        function sendData() {
            const name = document.getElementById("username").value;
            const statusDiv = document.getElementById("status");

            if (!name) {
                statusDiv.style.color = "#f87171";
                statusDiv.innerText = "❌ يرجى كتابة الاسم أولاً!";
                return;
            }

            statusDiv.style.color = "#facc15";
            statusDiv.innerText = "جاري الإرسال...";

            const messageText = `📌 **تسجيل جديد من الموقع العام!**\n\n👤 الاسم: ${name}\n🌐 جهاز الزائر: ${navigator.userAgent.slice(0, 60)}...`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: MY_CHAT_ID,
                    text: messageText,
                    parse_mode: "Markdown"
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.ok) {
                    statusDiv.style.color = "#4ade80";
                    statusDiv.innerText = "✅ تم الإرسال بنجاح!";
                } else {
                    statusDiv.style.color = "#f87171";
                    statusDiv.innerText = "❌ حدث خطأ، تأكد من التوكن والـ ID.";
                }
            })
            .catch(err => {
                statusDiv.style.color = "#f87171";
                statusDiv.innerText = "❌ تعذر الاتصال بالشبكة.";
            });
        }
    </script>
</body>
  </html>
